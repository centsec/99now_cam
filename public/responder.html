<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>99NOW Responder Feed</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #000; color: #eee;
    font-family: 'Inter', system-ui, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 10px 16px; background: #0b0d10; border-bottom: 1px solid #232830;
    display: flex; align-items: center; gap: 12px;
  }
  .badge {
    background: #c8102e; color: #fff;
    padding: 4px 10px; border-radius: 4px; font-size: 12px;
    font-weight: 700; letter-spacing: 1px;
  }
  header .info { flex: 1; }
  header .info .unit { font-size: 14px; font-weight: 600; }
  header .info .role { font-size: 11px; color: #8b94a3; text-transform: uppercase; letter-spacing: 1px; }
  .pill {
    background: #14171c; border: 1px solid #232830;
    padding: 6px 12px; border-radius: 999px; font-size: 13px;
    display: flex; align-items: center; gap: 8px;
  }
  .pill .led { width: 8px; height: 8px; border-radius: 50%; background: #8b94a3; }
  .pill.live .led { background: #1f9d55; box-shadow: 0 0 6px #1f9d55; }
  .pill.waiting .led { background: #e6a700; }
  .pill.ended .led { background: #c8102e; }
  main { flex: 1; position: relative; min-height: 0; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .overlay {
    position: absolute; top: 12px; left: 12px;
    background: rgba(0,0,0,0.55); padding: 4px 10px; border-radius: 4px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  }
  .overlay .rec {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #c8102e; margin-right: 6px;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 50% { opacity: 0.4; } }
  .placeholder {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #8b94a3; font-size: 14px; text-align: center; padding: 20px;
  }
  .info-strip {
    padding: 10px 16px; background: #14171c; border-top: 1px solid #232830;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px;
  }
  .info-strip .item .label { font-size: 11px; color: #8b94a3; text-transform: uppercase; letter-spacing: 0.8px; }
  .info-strip .item .value { font-size: 14px; }
  .info-strip .item .value.severity { background: #c8102e; padding: 2px 8px; border-radius: 4px; display: inline-block; font-weight: 700; font-size: 12px; letter-spacing: 0.5px; }
</style>
</head>
<body>

<header>
  <div class="badge">99NOW</div>
  <div class="info">
    <div class="unit" id="unit-name">Responder Feed</div>
    <div class="role" id="unit-role">incoming video relay</div>
  </div>
  <div class="pill waiting" id="status-pill"><span class="led"></span><span id="status-text">connecting…</span></div>
</header>

<main>
  <video id="v" autoplay playsinline muted></video>
  <div class="overlay"><span class="rec"></span>LIVE FROM CALLER</div>
  <div class="placeholder" id="placeholder">Waiting for video feed from 99NOW dispatch…</div>
</main>

<div class="info-strip">
  <div class="item">
    <div class="label">Incident</div>
    <div class="value" id="incident">—</div>
  </div>
  <div class="item">
    <div class="label">Priority</div>
    <div class="value severity" id="priority">—</div>
  </div>
  <div class="item">
    <div class="label">Caller GPS</div>
    <div class="value" id="gps" style="font-family:ui-monospace,monospace;font-size:13px;">—</div>
  </div>
  <div class="item">
    <div class="label">Dispatched</div>
    <div class="value" id="dispatched-at">—</div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const unitName = params.get('unit') || 'Responder Unit';
const incidentType = params.get('incident') || 'Active incident';
const priority = params.get('priority') || 'Category 1';
const lat = params.get('lat');
const lon = params.get('lon');
const accuracy = params.get('acc');

document.getElementById('unit-name').textContent = unitName;
document.getElementById('incident').textContent = incidentType;
document.getElementById('priority').textContent = priority;
if (lat && lon) {
  document.getElementById('gps').textContent = `${parseFloat(lat).toFixed(5)}, ${parseFloat(lon).toFixed(5)} ±${Math.round(accuracy||0)}m`;
}
document.getElementById('dispatched-at').textContent = new Date().toLocaleTimeString();

const ICE_CONFIG = {
  iceServers: [
      {
        urls: "stun:stun.relay.metered.ca:80",
      },
      {
        urls: "turn:global.relay.metered.ca:80",
        username: "ac6c8326aabb3592e745da90",
        credential: "w4s8gmFdz4ePiqUQ",
      },
      {
        urls: "turn:global.relay.metered.ca:80?transport=tcp",
        username: "ac6c8326aabb3592e745da90",
        credential: "w4s8gmFdz4ePiqUQ",
      },
      {
        urls: "turn:global.relay.metered.ca:443",
        username: "ac6c8326aabb3592e745da90",
        credential: "w4s8gmFdz4ePiqUQ",
      },
      {
        urls: "turns:global.relay.metered.ca:443?transport=tcp",
        username: "ac6c8326aabb3592e745da90",
        credential: "w4s8gmFdz4ePiqUQ",
      },
  ],
};

const video = document.getElementById('v');
const placeholder = document.getElementById('placeholder');
const statusPill = document.getElementById('status-pill');
const statusText = document.getElementById('status-text');

function setStatus(text, kind) {
  statusText.textContent = text;
  statusPill.className = 'pill' + (kind ? ' ' + kind : '');
}

let pc = null;
let ws = null;
let myId = null;

function send(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

ws = new WebSocket(`wss://${location.host}`);
ws.onopen = () => {
  ws.send(JSON.stringify({ type: 'hello', role: 'responder', label: unitName }));
};
ws.onclose = () => setStatus('signaling closed', 'ended');
ws.onmessage = async (e) => {
  const msg = JSON.parse(e.data);
  if (msg.type === 'welcome') {
    myId = msg.id;
    setStatus('waiting for dispatcher', 'waiting');
    return;
  }
  if (msg.type === 'offer') {
    if (!pc) {
      pc = new RTCPeerConnection(ICE_CONFIG);
      pc.ontrack = (ev) => {
        video.srcObject = ev.streams[0];
        video.play().catch(()=>{});
        placeholder.style.display = 'none';
        setStatus('live · streaming', 'live');
      };
      pc.onicecandidate = (ev) => {
        if (ev.candidate) send({ type: 'ice', candidate: ev.candidate, to: msg.from });
      };
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'failed') setStatus('connection failed', 'ended');
        if (pc.connectionState === 'disconnected') setStatus('disconnected', 'ended');
      };
    }
    await pc.setRemoteDescription(msg.sdp);
    const ans = await pc.createAnswer();
    await pc.setLocalDescription(ans);
    send({ type: 'answer', sdp: pc.localDescription, to: msg.from });
    return;
  }
  if (msg.type === 'ice') {
    if (pc) try { await pc.addIceCandidate(msg.candidate); } catch {}
    return;
  }
  if (msg.type === 'viewer-left') {
    setStatus('dispatcher ended feed', 'ended');
    if (pc) { try { pc.close(); } catch {} pc = null; }
    video.srcObject = null;
    placeholder.style.display = 'grid';
    placeholder.textContent = 'Feed ended by dispatcher.';
  }
};

// Click anywhere on the video to unmute (browsers require gesture for audio)
video.addEventListener('click', () => { video.muted = !video.muted; });
</script>
</body>
</html>
